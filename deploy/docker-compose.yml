#   network: smartadmin_default (alias: mysql)
#   publish: 0.0.0.0:3307->3306
#   volume: smartadmin_mysql-data
# ????: /home/ubuntu/apps/smart-admin/deploy/mysql-standalone.sh
# ==========================================================================

services:
  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: smartadmin-redis
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:6379:6379"
      - "10.66.66.1:6379:6379"
    volumes:
      - redis-data:/data

  # ============ RabbitMQ: ???? ============
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smartadmin-rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ============ ???? Dockerfile ??????? ============
  sa-admin:
    build:
      context: ../smart-admin-api-java17-springboot3
    image: smartadmin-api:latest
    container_name: smartadmin-api
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      TZ: Asia/Shanghai
      # ???? MySQL ?????? mysql
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/smart_admin_v3?autoReconnect=true&useServerPreparedStmts=false&rewriteBatchedStatements=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 1
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_CHAT_API_KEY: ${AI_CHAT_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    volumes:
      - upload-data:/home/smart_admin_v3/upload
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # ============ Nginx???????????? + ???? ============
  nginx:
    image: nginx:alpine
    container_name: smartadmin-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ../smart-admin-web-javascript/dist:/usr/share/nginx/html
      - ../smart-app/dist/build/h5:/usr/share/nginx/html/app:ro
      - upload-data:/upload:ro
    depends_on:
      - sa-admin

volumes:
  redis-data:
  upload-data:
  rabbitmq-data:
