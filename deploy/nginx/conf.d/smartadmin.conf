server {
    listen 80;
    server_name localhost;

    # 上传文件大小限制（商城图片等）
    client_max_body_size 100m;

    # ============ PC管理端前端：静态文件 ============
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # Vue history 路由刷新不 404
        try_files $uri $uri/ /index.html;
    }

    # ============ 商城H5：挂在 /app/ 子路径 ============
    # 构建产物挂载在 html/app/ 下（见 docker-compose.yml），
    # manifest.json 已配置 h5.router.base = /app/
    location /app/ {
        root  /usr/share/nginx/html;
        index index.html;
        # H5 路由刷新不 404，回退到 /app/index.html
        try_files $uri $uri/ /app/index.html;
    }

    # ============ 本地上传文件（与 sa-base.yaml file.storage.local 对齐） ============
    location /upload/ {
        alias /upload/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============ 后端：/api/ 开头的请求转发给后端容器 ============
    # 结尾的 / 会剥掉 /api 前缀：/api/login -> 后端 /login
    location /api/ {
        proxy_pass http://sa-admin:1024/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        # 后端日志里显示真实客户端 IP
        proxy_send_timeout 60s;
    }
}
